[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[headers]]
for = "/admin.html"
[headers.values]
Cache-Control = "no-store"
X-Robots-Tag = "noindex, nofollow"
Referrer-Policy = "no-referrer"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
